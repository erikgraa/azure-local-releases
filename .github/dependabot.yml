version: 2

# PowerShell has no supported Dependabot ecosystem, so only the GitHub Actions and the container base image are covered.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
