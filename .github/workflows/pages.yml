name: "Build and deploy site"

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - site/**
      - .github/workflows/pages.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate site data (JSON, RSS, JSON Feed)
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: ./scripts/Build-Site.ps1

      # Keeps json/azure-local-releases.json current for consumers of the raw file
      - name: Commit updated JSON
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json
            git commit -m "Auto updating Azure Local Releases"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
