<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azure Local EOL</title>
  <style>
    .bg { fill: #005a9e; }
    .ring { stroke: #fff; }
    .node { fill: #fff; }
    .eol { fill: #f5a742; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7fc0ff; }
      .ring { stroke: #0f1b27; }
      .node { fill: #0f1b27; }
      .eol { fill: #c46a00; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <!-- Support window: three quarters of a clock face, clockwise from 12 o'clock -->
  <circle class="ring" cx="32" cy="32" r="19" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="89.5 120" transform="rotate(-90 32 32)"/>
  <!-- Stacked nodes -->
  <rect class="node" x="24.5" y="25" width="15" height="5" rx="2.5"/>
  <rect class="node" x="24.5" y="34" width="15" height="5" rx="2.5"/>
  <!-- End of support marker where the window closes -->
  <circle class="eol" cx="13" cy="32" r="5"/>
</svg>
