  <!-- Azure Local: the cloud, as a badge -->
  <path class="badge" transform="translate(22 26) scale(1.7)" stroke-width="2" stroke-linejoin="round" paint-order="stroke" d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
</svg>
