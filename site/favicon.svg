  <rect class="ring" x="15" y="5" width="5" height="10" rx="2.5" stroke-width="2"/>
  <rect class="ring" x="34" y="5" width="5" height="10" rx="2.5" stroke-width="2"/>
  <circle class="dot" cx="15" cy="30" r="3"/>
  <circle class="dot" cx="25" cy="30" r="3"/>
  <circle class="dot" cx="15" cy="40" r="3"/>
