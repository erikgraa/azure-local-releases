<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azure Local Lifecycle</title>
  <style>
    .bg { fill: #005a9e; }
    .shape { fill: #fff; }
    .end { fill: #f5a742; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7fc0ff; }
      .shape { fill: #0f1b27; }
      .end { fill: #c46a00; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <!-- Azure Local: the cloud, brought on premises -->
  <path class="shape" transform="translate(9.5 1.5) scale(1.85)" d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
  <!-- Overlapping support windows, the earlier one is the next to end -->
  <rect class="shape" x="8" y="41" width="32" height="7" rx="3.5"/>
  <rect class="shape" x="20" y="51" width="36" height="7" rx="3.5"/>
  <circle class="end" cx="45" cy="44.5" r="5"/>
</svg>
