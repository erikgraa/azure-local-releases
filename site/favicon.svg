<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Azure Local Lifecycle</title>
  <style>
    .bg { fill: #005a9e; }
    .page { fill: #fff; }
    .head { fill: #cfe4f5; }
    .ring { fill: #fff; stroke: #005a9e; }
    .cloud { fill: #005a9e; }
    .end { fill: #f5a742; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #7fc0ff; }
      .page { fill: #0f1b27; }
      .head { fill: #243648; }
      .ring { fill: #0f1b27; stroke: #7fc0ff; }
      .cloud { fill: #7fc0ff; }
      .end { fill: #e8a13a; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <!-- Calendar page -->
  <rect class="page" x="9" y="12" width="46" height="43" rx="7"/>
  <path class="head" d="M9 25h46v-6a7 7 0 0 0-7-7H16a7 7 0 0 0-7 7Z"/>
  <rect class="ring" x="19" y="7" width="5" height="11" rx="2.5" stroke-width="2"/>
  <rect class="ring" x="40" y="7" width="5" height="11" rx="2.5" stroke-width="2"/>
  <!-- Azure Local: the cloud, brought on premises -->
  <path class="cloud" transform="translate(13.5 21.5) scale(1.55)" d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
  <!-- End of support date -->
  <circle class="end" cx="46" cy="33" r="4"/>
</svg>
