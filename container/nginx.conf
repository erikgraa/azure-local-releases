# Replaces conf.d/default.conf of nginxinc/nginx-unprivileged, so it is included at http level.

# Everything is revalidated (ETag) except images, so a rebuilt image is picked up immediately.
# data/, feeds, calendars, sw.js and index.html fall under the default.
map $uri $azl_cache_control {
    default                                  "no-cache";
    ~*\.(png|svg|ico|webp)$                  "public, max-age=604800";
}

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css text/calendar text/javascript application/javascript application/json
           application/feed+json application/rss+xml application/xml image/svg+xml application/manifest+json;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    add_header Cache-Control $azl_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
    }

    location = /feed.json {
        types { }
        default_type application/feed+json;
    }

    location ~* \.ics$ {
        types { }
        default_type text/calendar;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location = /CNAME {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
